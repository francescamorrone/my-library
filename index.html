<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno II</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section">
      <form id="aggiungi-libro">
        <div class="container">
          <div class="row">

            <div class="col-12 mb-4">
              <label for="titolo" class="form-label fw-bold fs-5">Titolo</label>
              <input type="text" name="titolo" id="titolo" class="form-control" required>
            </div>

            <div class="col-12 mb-4">
              <label for="autore" class="form-label fw-bold fs-5">Autore</label>
              <input type="text" name="autore" id="autore" class="form-control" required>
            </div>

            <div class="col-12 mb-4">
              <label for="anno" class="form-label fw-bold fs-5">Anno</label>
              <input type="number" name="anno" id="anno" class="form-control" required>
            </div>

            <div class="col-12 mb-4">
              <label for="formato" class="form-label fw-bold fs-5">Formato</label>
              <select name="formato" id="formato" class="form-select">
                <option value="cartaceo">Cartaceo</option>
                <option value="digitale">Digitale</option>
              </select>
            </div>

            <div class="campo campo-condizionale mb-4" id="campo-dimensione" hidden>
              <div class="col-12">
                <label for="dimensione" class="form-label fw-bold fs-5">Dimensione MB</label>
                <input type="number" step="0.1" name="dimensione" id="dimensione" class="form-control">
              </div>
            </div>

            <div class="col-12 mb-4">
              <button type="submit" class="btn btn-primary" id="add">Aggiungi</button>
            </div>
            
          </div>
        </div>
      </form>
    </section>

    <section class="lista-section">
      <div class="lista-header">
        <h2>I tuoi libri</h2>
        <button id="svuota-tutto" class="btn-svuota">
          Svuota tutto
        </button>
      </div>
      <p class="info-storage">I libri sono salvati nel browser e sopravvivono al refresh.</p>
      <ul id="lista-libri" class="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>

  <script src="assets/js/script.js"></script>
</body>

</html>
