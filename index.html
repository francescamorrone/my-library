<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-libreria — Settimana VII Giorno I</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header class="site-header">
    <h1>La mia libreria</h1>
    <p>Aggiungi i tuoi libri e segnali come letti.</p>
  </header>

  <main class="container">

    <section class="form-section">
      <form id="log-book">
        <div class="container">
          <div class="row">

            <div class="col-12 mb-4">
              <label for="new-title" class="form-label fw-bold fs-5">Titolo</label>
              <input type="text" name="title" id="new-title" class="form-control">
            </div>

            <div class="col-12 mb-4">
              <label for="new-author" class="form-label fw-bold fs-5">Autore</label>
              <input type="text" name="author" id="new-author" class="form-control">
            </div>

            <div class="col-12 mb-4">
              <label for="new-year" class="form-label fw-bold fs-5">Anno</label>
              <input type="text" name="year" id="new-year" class="form-control">
            </div>

            <div class="col-12 mb-4">
              <label for="new-format" class="form-label fw-bold fs-5">Formato</label>
              <select name="format" id="new-format" class="form-select">
                <option value="cartaceo">Cartaceo</option>
                <option value="digitale">Digitale</option>
              </select>
            </div>

            <div class="campo campo-condizionale mb-4" id="campo-dimensione" hidden>
              <div class="col-12">
                <label for="new-mb" class="form-label fw-bold fs-5">Dimensione MB</label>
                <input type="number" step="0.1" id="new-mb" class="form-control">
              </div>
            </div>

            <div class="col-12 mb-4">
              <button type="submit" class="btn btn-primary" id="add">Aggiungi</button>
            </div>
            
          </div>
        </div>

      </form>
    </section>

    <section class="lista-section">
      <h2>I tuoi libri</h2>
      <ul id="lista-libri">
        <!-- popolato da JavaScript -->
      </ul>
    </section>

  </main>

  <script src="assets/js/script.js"></script>
</body>

</html>
